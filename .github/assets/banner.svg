<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="DirDocs — 放哪，哪就是知识库">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#edf3fc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a90f4"/>
      <stop offset="1" stop-color="#2563d6"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0v28" fill="none" stroke="#2563d6" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="960" height="280" rx="16" fill="url(#bg)"/>
  <rect width="960" height="280" rx="16" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="957" height="277" rx="15" fill="none" stroke="#d4e0f2"/>

  <!-- 图标：文件夹 + 冒头的 .md 文档 -->
  <g transform="translate(206,88)">
    <path d="M10 4 h34 l14 14 h74 a10 10 0 0 1 10 10 v58 a10 10 0 0 1 -10 10 h-132 a10 10 0 0 1 -10 -10 v-72 a10 10 0 0 1 10 -10 z"
          fill="url(#accent)"/>
    <rect x="36" y="-16" width="88" height="92" rx="8" fill="#ffffff" stroke="#c7d7ef" stroke-width="1.5"/>
    <polyline points="52,8 52,26 62,14 72,26 72,8" fill="none" stroke="#2563d6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="86" y1="8" x2="86" y2="24" stroke="#2563d6" stroke-width="3.5" stroke-linecap="round"/>
    <polyline points="80,19 86,26 92,19" fill="none" stroke="#2563d6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-10" y="34" width="162" height="54" rx="10" fill="#2f6bde"/>
    <rect x="-10" y="34" width="162" height="10" rx="5" fill="#ffffff" opacity="0.14"/>
  </g>

  <!-- 字标 -->
  <text x="392" y="158" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="92" fill="#17233b"><tspan font-weight="300">Dir</tspan><tspan font-weight="800">Docs</tspan></text>

  <!-- 标语 -->
  <text x="480" y="226" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="24" fill="#51617a">放哪，哪就是知识库 · Drop a folder, get a knowledge base.</text>
</svg>
