name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 组装发布说明（部署头部 + CHANGELOG 本版本段落）
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="v$VERSION" '
            $0 ~ ("^## " ver "( |$)") {found = 1; next}
            /^## / {found = 0}
            found
          ' CHANGELOG.md > /tmp/section.md
          [ -s /tmp/section.md ] || echo "详见 [CHANGELOG.md](CHANGELOG.md)。" > /tmp/section.md
          cat .github/release-header.md /tmp/section.md > release_notes.md

      - name: 打包（完整安装包 + 覆盖升级包）
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 完整安装包：首次部署用（含示例文档说明与许可证）
          git archive --format=zip --prefix="DirDocs-$VERSION/" \
            -o "DirDocs-${GITHUB_REF_NAME}.zip" \
            "$GITHUB_REF_NAME" -- index.php _dir README.md CHANGELOG.md LICENSE
          # 覆盖升级包：只含随版本覆盖的运行时文件（index.php + _dir/lib + _dir/assets）。
          # 用户数据（_dir/config.php、_dir/cache/、_dir/themes/、文档与附件）一律不在包内；
          # 内置主题权威副本在 _dir/lib/builtin-themes/，随 lib 升级，不需要手工覆盖 themes/。
          git archive --format=zip --prefix="DirDocs-$VERSION-update/" \
            -o "DirDocs-${GITHUB_REF_NAME}-update.zip" \
            "$GITHUB_REF_NAME" -- index.php _dir/lib _dir/assets LICENSE

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "DirDocs-${GITHUB_REF_NAME}.zip" \
            "DirDocs-${GITHUB_REF_NAME}-update.zip" \
            --title "DirDocs $GITHUB_REF_NAME" \
            --notes-file release_notes.md
