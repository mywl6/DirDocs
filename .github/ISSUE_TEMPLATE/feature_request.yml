name: 功能建议
description: 提议新功能或改进（会先对照产品原则评估可行性）
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        DirDocs 是一个刻意做减法的项目：**安全 > 部署方便 > 使用方便**，
        并坚持零数据库、零构建、零外联（两处出站例外——SMTP 与新版本检查——
        都默认关闭、须站长在后台显式开启）。建议会先按这些原则评估可行性，
        与原则冲突时会被婉拒——这是产品定位，不是针对方案本身。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / 使用场景
      description: 先讲场景与痛点，再谈方案
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
  - type: textarea
    id: alternatives
    attributes:
      label: 现有的替代 / 绕过办法
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我理解该建议不应引入外部依赖、数据库，或默认开启的外联请求
        - label: 我愿意参与后续讨论，细化或调整方案
